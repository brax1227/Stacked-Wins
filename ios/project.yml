# Xcode project definition, generated by XcodeGen.
#
# Why a spec instead of a checked-in .xcodeproj: nobody on this project has
# needed a Mac so far, and a .pbxproj is a wall of generated UUIDs that can't
# be edited or reviewed by hand. This file is the source of truth; CI runs
# `xcodegen generate` to produce StackedWins.xcodeproj on the fly.
#
# Local use (needs a Mac):
#   brew install xcodegen && cd ios && xcodegen generate && open StackedWins.xcodeproj

name: StackedWins

options:
  bundleIdPrefix: com.stackedwins
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # Shown to testers as the version. Bump by hand for a real release.
    MARKETING_VERSION: "0.1.0"
    # Overridden by CI with the workflow run number, so every upload to
    # TestFlight has a unique build number (App Store Connect rejects repeats).
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM is supplied by CI from the APPLE_TEAM_ID secret.
    #
    # Where the app talks to. Baked into Info.plist below; CI overrides it from
    # the API_BASE_URL repository variable. Users can still change it in the
    # app's Server screen, which is how a TestFlight build reaches a backend
    # running on your own computer.
    API_BASE_URL: "http://localhost:3001"

targets:
  StackedWins:
    type: application
    platform: iOS
    sources:
      - path: StackedWins/StackedWins
    # Written by XcodeGen at generate time (so it's gitignored, like the
    # .xcodeproj). Spelled out rather than using GENERATE_INFOPLIST_FILE so
    # every key here is one we chose, not one we hoped Xcode supported.
    info:
      path: StackedWins/Info.plist
      properties:
        CFBundleDisplayName: Stacked Wins
        # Empty dict = use the default generated launch screen. Without a
        # launch screen key at all, iOS runs the app letterboxed.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Declares no non-exempt encryption. Without this, every TestFlight
        # upload sits in "Missing Compliance" until someone answers the export
        # questionnaire by hand in App Store Connect.
        ITSAppUsesNonExemptEncryption: false
        # Substituted from the build setting of the same name at build time.
        API_BASE_URL: $(API_BASE_URL)
        # Lets the app reach a plain-http backend on the local network (your
        # laptop's LAN address) without disabling transport security for the
        # internet at large. Anything non-local still needs https.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        # CHANGE THIS to a bundle ID you own and have registered in the
        # Apple Developer portal. It must match across the portal, the App
        # Store Connect app record, and this file, or signing will fail.
        PRODUCT_BUNDLE_IDENTIFIER: com.stackedwins.app
        TARGETED_DEVICE_FAMILY: "1"
        # The icon set in Assets.xcassets. App Store Connect refuses an upload
        # without one (errors 90022 / 90713). A single 1024x1024 PNG is enough;
        # Xcode derives every other size from it.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  StackedWins:
    build:
      targets:
        StackedWins: all
    run:
      config: Debug
    archive:
      config: Release
