name: iOS TestFlight

# Ships the iOS app to TestFlight from CI, so releasing never needs a Mac.
#
# Signing uses an App Store Connect API key rather than checked-in
# certificates: xcodebuild -allowProvisioningUpdates creates and downloads
# whatever certificate and profile it needs on the runner, then throws the
# runner away. Nothing to rotate by hand, no .p12 in the repo.
#
# Setup (one time) is documented in ios/TESTFLIGHT.md.

on:
  # The normal way to ship: Actions tab -> iOS TestFlight -> Run workflow.
  # Deliberately manual — you rarely want every push burning a build number.
  workflow_dispatch:
  # Or tag a release: git tag ios-v0.1.0 && git push origin ios-v0.1.0
  push:
    tags:
      - 'ios-v*'
  # On PRs, only check that it still compiles. No secrets, no upload — so
  # this also runs safely on PRs from forks.
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-testflight.yml'

permissions:
  contents: read

concurrency:
  # Never let two uploads race for the same build number.
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Cheap guard so the iOS app can't silently stop compiling. Simulator build,
  # no code signing, no credentials needed.
  compile-check:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for simulator (no signing)
        run: |
          xcodebuild build \
            -project ios/StackedWins.xcodeproj \
            -scheme StackedWins \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  testflight:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ARCHIVE_PATH: ${{ github.workspace }}/build/StackedWins.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/export
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets are present
        # Fail here with a readable message rather than 20 minutes later
        # inside a wall of xcodebuild output. Secrets come in through env,
        # never interpolated into the script body.
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.APPSTORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          missing=()
          [ -n "$ASC_KEY_ID" ] || missing+=(APPSTORE_CONNECT_API_KEY_ID)
          [ -n "$ASC_ISSUER_ID" ] || missing+=(APPSTORE_CONNECT_ISSUER_ID)
          [ -n "$APPLE_TEAM_ID" ] || missing+=(APPLE_TEAM_ID)
          [ -n "$ASC_KEY_P8_BASE64" ] || missing+=(APPSTORE_CONNECT_API_KEY_P8_BASE64)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            echo "See ios/TESTFLIGHT.md for how to create each one."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.APPSTORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          # altool looks for the key in this exact directory, under this exact
          # filename, so xcodebuild is pointed at the same copy.
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          # openssl rather than `base64 -d`: the BSD base64 on macOS runners
          # disagrees with GNU on the decode flag.
          printf '%s' "$ASC_KEY_P8_BASE64" | openssl base64 -d -A > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "::error::Decoded key is not a PEM private key. Re-copy the secret — see ios/TESTFLIGHT.md."
            exit 1
          fi
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          xcodebuild archive \
            -project ios/StackedWins.xcodeproj \
            -scheme StackedWins \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Write export options
        # Generated rather than committed so the team ID lives only in secrets.
        run: |
          mkdir -p build
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST

      - name: Export .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to TestFlight
        run: |
          IPA=$(find "$EXPORT_PATH" -name '*.ipa' -maxdepth 1 | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::No .ipa was produced by the export step."
            exit 1
          fi
          echo "Uploading $(basename "$IPA") as build ${{ github.run_number }}"
          xcrun altool --upload-app \
            --file "$IPA" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Keep the .ipa for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StackedWins-ipa-${{ github.run_number }}
          path: ${{ env.EXPORT_PATH }}/*.ipa
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove the signing key from the runner
        if: always()
        run: rm -rf ~/.appstoreconnect/private_keys
